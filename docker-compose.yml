# ─────────────────────────────────────────────────────────────────────────────
# AGRIFLOW-AI — Local Development Stack
#
# Services:
#   db       — PostgreSQL 17 + TimescaleDB with persistent volume
#   redpanda — Kafka-compatible event bus (Phase 14)
#   backend  — FastAPI (auto-reload enabled for development)
#   outbox-relay — Publishes domain_event_outbox rows to Redpanda
#   event-audit-consumer — Logs domain events from all catalog topics (dev)
#   alert-evaluation-consumer — Business handler: soil moisture → alerts
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in real values first
#   docker compose up --build
#
# Run migrations separately (before first start or after schema changes):
#   docker compose run --rm backend alembic upgrade head
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:2.28.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agriflow}
      POSTGRES_USER: ${POSTGRES_USER:-agriflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agriflow} -d ${POSTGRES_DB:-agriflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redpanda (Kafka API) ───────────────────────────────────────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.2
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --mode
      - dev-container
    ports:
      - "19092:19092"

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override localhost with the compose service name
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      APP_ENV: development
      LOG_FORMAT: console
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      # Mount source for live reload — dev only, remove for production
      - ./backend:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    depends_on:
      db:
        condition: service_healthy

  # ── Outbox relay (Phase 14) ─────────────────────────────────────────────────
  outbox-relay:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      EVENTS_ENABLED: "true"
      REDPANDA_ENABLED: "true"
      REDPANDA_BROKERS: redpanda:9092
      LOG_FORMAT: console
      LOG_LEVEL: INFO
    command: python -m app.events.relay
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started

  event-audit-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDPANDA_ENABLED: "true"
      REDPANDA_BROKERS: redpanda:9092
      LOG_FORMAT: console
      LOG_LEVEL: INFO
    command: python -m app.events.consumer
    depends_on:
      redpanda:
        condition: service_started

  # ── Temporal (Phase 16 — dev server) ───────────────────────────────────────
  temporal:
    image: temporalio/temporal:latest
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"

  temporal-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TEMPORAL_ENABLED: "true"
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_SOIL_MOISTURE_PERSISTENCE_MINUTES: "1"
      LOG_FORMAT: console
      LOG_LEVEL: INFO
    command: python -m app.temporal.worker
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_started

  alert-evaluation-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDPANDA_ENABLED: "true"
      REDPANDA_BROKERS: redpanda:9092
      ALERT_EVALUATION_ENABLED: "true"
      ML_ENGINE_AUTO_RUN_ENABLED: ${ML_ENGINE_AUTO_RUN_ENABLED:-false}
      LOG_FORMAT: console
      LOG_LEVEL: INFO
    command: python -m app.events.business_consumer
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started

volumes:
  postgres_data:
    driver: local
